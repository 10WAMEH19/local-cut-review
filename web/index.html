<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Cut Review</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true">L<span>／</span>C</span><div><h1>Local Cut Review</h1><p>Build and review a rough cut on your Mac</p></div></div>
  <div class="header-actions">
    <button id="new-project" type="button">New project</button>
    <button id="import" class="primary" type="button">Import videos</button>
    <input id="file" type="file" accept="video/*,.mov,.mp4,.m4v,.webm" multiple hidden>
  </div>
</header>
<div id="notice" role="status" aria-live="polite">Loading local project…</div>
<main>
  <aside class="panel brief">
    <h2>Material and brief</h2>
    <ul id="sources" aria-label="Imported videos"></ul>
    <label for="goal">Creative goal <span class="muted">optional</span></label>
    <textarea id="goal" rows="3" maxlength="1200" placeholder="What should the finished video communicate?"></textarea>
    <label for="retain">Content to preserve <span class="muted">optional</span></label>
    <textarea id="retain" rows="2" maxlength="1200" placeholder="For example, keep the explanation of each step."></textarea>
    <button id="suggest" class="primary wide" type="button">Build AI rough cut</button>
    <p id="analysis-status" class="hint"></p>
  </aside>
  <section class="workspace" aria-label="Video editor">
    <div class="player-heading"><h2 id="source-name">Preview</h2><span id="save-state" class="muted"></span></div>
    <div class="view-switch" role="group" aria-label="Preview mode">
      <button id="source-mode" type="button" aria-pressed="true">Source preview</button>
      <button id="draft-mode" type="button" aria-pressed="false">Rough cut</button>
      <span id="mode-note"></span>
    </div>
    <div class="video-wrap"><video id="video" controls playsinline preload="metadata"></video><p id="player-empty">Import a video to begin</p></div>
    <div class="timeline-head"><h3>Rough-cut order</h3><span id="edit-duration" class="muted"></span></div>
    <div id="sequence-track" aria-label="Jump to a rough-cut segment" hidden></div>
    <ol id="timeline" aria-label="Rough-cut clip order"></ol>
    <details class="manual" id="manual">
      <summary>Add a local cut manually</summary>
      <div class="bounds">
        <label>Start (seconds)<input id="manual-start" type="number" min="0" step="0.01"></label>
        <label>End (seconds)<input id="manual-end" type="number" min="0" step="0.01"></label>
      </div>
      <button id="use-time" type="button">Use source playhead</button>
      <button id="add-manual" type="button">Add proposal</button>
    </details>
    <div class="export-row">
      <button id="save-decisions" type="button">Save decisions</button>
      <label class="export-quality">Export quality<select id="quality"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="2160">4K</option></select></label>
      <button id="export" type="button" class="primary">Export MP4</button>
    </div>
    <p id="export-status" role="status" class="hint"></p>
  </section>
  <section class="review panel" aria-label="Review editing decisions">
    <div class="review-head"><h2>Review changes</h2><span id="pending-count" class="count"></span></div>
    <div id="plan-goal" class="hint"></div>
    <button id="approve" type="button" class="primary wide" hidden>Confirm rough cut</button>
    <div id="suggestions"></div>
  </section>
</main>
<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2><p id="confirm-text"></p>
    <div class="dialog-actions"><button value="cancel">Cancel</button><button class="primary" id="confirm-yes" value="confirm">Confirm</button></div>
  </form>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
